<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="せかいクイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d8fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>せかい たんけんクイズ</title>
<style>
:root{
  --blue:#2d8fd0; --blue-d:#1f6fa6; --ink:#33291f; --sub:#7a6a5c; --bg:#eaf6fd; --card:#fff;
  --ok:#2fb36a; --ng:#e8574f; --warn:#ff9f1c; --line:#d9e6ee;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.screen.on{display:flex}

/* ---------- ホーム ---------- */
#home{overflow-y:auto;align-items:center;background:linear-gradient(#bfe6fb,#eaf6fd 40%)}
.home-in{width:min(760px,100%);padding:18px 18px 36px}
.logo{text-align:center;margin:8px 0 14px}
.logo .big{font-size:clamp(28px,6vw,46px);font-weight:900;color:var(--blue-d);letter-spacing:.04em;
  text-shadow:0 2px 0 #fff,0 0 12px #fff}
.logo .sm{font-size:14px;color:var(--sub);font-weight:700;margin-top:4px}
.logo .em{font-size:40px;letter-spacing:6px;margin-bottom:2px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.menu{grid-template-columns:1fr}}
.mbtn{background:var(--card);border-radius:22px;padding:16px 16px 14px;text-align:left;
  box-shadow:0 5px 0 rgba(0,0,0,.08),0 8px 18px rgba(30,90,140,.12);display:flex;gap:14px;align-items:center;
  transition:transform .08s}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.mbtn .ic{font-size:42px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:none}
.mbtn b{display:block;font-size:19px}
.mbtn span.d{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
.ic.p{background:#ffe9a8}.ic.m{background:#d9efd2}.ic.r{background:#cfe9fb}.ic.a{background:#f9d6e6}
.opts{background:var(--card);border-radius:22px;padding:14px 16px;margin-top:16px;box-shadow:0 5px 14px rgba(30,90,140,.1)}
.opts h3{margin:0 0 8px;font-size:15px;color:var(--blue-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#eef3f7;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;border:2px solid transparent}
.chip.on{background:#d8efff;border-color:var(--blue);color:var(--blue-d)}
.stats{margin-top:14px;font-size:13px;color:var(--sub);text-align:center;line-height:1.7}
.foot{margin-top:10px;text-align:center;font-size:11px;color:#9a8c7e;line-height:1.6}

/* ---------- ゲーム ---------- */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.top .back{background:#eef3f7;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.top .ttl{font-weight:900;font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sc{font-weight:900;font-size:15px;background:#fff4cf;border-radius:12px;padding:7px 10px;white-space:nowrap}
.top .snd{background:#eef3f7;border-radius:12px;padding:7px 10px;font-size:16px}
.gm{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{flex:none;background:#fff;margin:8px 8px 0;border-radius:18px;padding:10px 12px;
  box-shadow:0 3px 10px rgba(30,90,140,.12);max-height:44vh;overflow-y:auto}
.mapwrap{position:relative;flex:1;min-height:0;margin:8px;border-radius:18px;overflow:hidden;
  background:#d4ecfa;box-shadow:inset 0 0 0 2px #b8dcf1}
@media (orientation:landscape) and (min-width:560px){
  .gm{flex-direction:row}
  .panel{width:min(380px,40vw);max-height:none;margin:8px 0 8px 8px;overflow-y:auto}
  .mapwrap{margin:8px}
}
svg#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zb{position:absolute;right:10px;display:flex;flex-direction:column;gap:8px}
.zb button{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.95);font-size:22px;font-weight:900;
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
.layers{position:absolute;left:10px;top:10px;display:flex;gap:8px}
.layers button{background:rgba(255,255,255,.95);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;
  box-shadow:0 2px 6px rgba(0,0,0,.18);border:2px solid transparent}
.layers button.on{background:#d8efff;border-color:var(--blue)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(40,30,20,.88);color:#fff;
  padding:9px 16px;border-radius:999px;font-weight:800;font-size:15px;pointer-events:none;opacity:0;transition:opacity .2s;
  max-width:90%;text-align:center;z-index:3}
.toast.on{opacity:1}

.q-lab{font-size:13px;font-weight:800;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.q-main{font-size:19px;font-weight:900;margin:4px 0 6px;line-height:1.4}
.q-main small{font-size:13px;color:var(--sub);font-weight:700}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.emo .eb{display:flex;flex-direction:column;align-items:center;background:#f6fafd;border-radius:14px;padding:4px 8px;min-width:66px}
.eb b{font-size:clamp(32px,7vw,46px);font-weight:400;line-height:1.1}
.eb i{font-size:12.5px;font-style:normal;font-weight:800;color:#5a4a3c;margin-top:1px}
.modal{position:fixed;inset:0;background:rgba(30,40,50,.55);display:none;z-index:20;overflow-y:auto;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px)}
.modal.on{display:block}
.mc{max-width:760px;margin:0 auto;background:#fff;border-radius:22px;padding:14px 14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mh h2{margin:0;font-size:26px}
.mh .sub{font-size:13px;font-weight:800;color:var(--ok)}
.mmap{margin:8px 0;border-radius:16px;overflow:hidden;background:#d4ecfa}
.mmap svg{display:block;width:100%;height:auto;max-height:62vh}
.mf{display:grid;gap:8px;margin-top:6px}
.mf .row{display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.5}
.mf .k{flex:none;min-width:84px;font-weight:900;font-size:13px;color:var(--blue-d);background:#e6f3fc;border-radius:8px;padding:2px 8px;text-align:center}
.mf .v{flex:1;min-width:0}
.mf .it2{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}
.mf .it2 b{font-size:22px;font-weight:400;margin-right:3px;vertical-align:-2px}
.mbtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:120px}
.hint{background:#fff9e3;border-left:5px solid var(--warn);border-radius:10px;padding:7px 10px;margin:6px 0;font-size:14px;line-height:1.5;
  animation:slide .25s}
.hint b{color:#c77700}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border-radius:14px;padding:11px 16px;font-weight:900;font-size:15px;background:#eef3f7;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--blue);color:#fff}
.btn.hint-b{background:#ffe19a}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45}
.res{border-radius:14px;padding:10px 12px;margin:6px 0}
.res.good{background:#e6f7ee;border:2px solid var(--ok)}
.res.bad{background:#fdecea;border:2px solid var(--ng)}
.res h4{margin:0 0 4px;font-size:18px}
.stars{font-size:22px;letter-spacing:2px}
.facts{font-size:14px;line-height:1.55;margin-top:4px}
.facts .row{margin:2px 0}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;margin-right:4px}

/* 結果 */
#result{align-items:center;overflow-y:auto;background:linear-gradient(#ffe9a8,#eaf6fd 40%)}
.res-in{width:min(640px,100%);padding:22px 16px 40px;text-align:center}
.res-in h2{margin:6px 0;font-size:28px}
.bigstars{font-size:44px;letter-spacing:4px}
.lst{background:#fff;border-radius:18px;padding:8px 12px;margin:14px 0;text-align:left;font-size:14px}
.lst div{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.lst div:last-child{border:0}

/* 地図スタイル */
.pref{stroke:#fff;stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s,opacity .25s;cursor:pointer}
.pref.un{fill:#f7fafc;stroke:#8fa3b1;stroke-width:1px}
.pref.oki{stroke:#6aa9d0;stroke-dasharray:5 3}
.pref.oki.un{fill:#e4f1f9}
#gScore:empty{display:none}
.pref.hl{stroke:#ff8a00;stroke-width:3px}
.pref.dim{opacity:.55}
.pref.pop{animation:pop .5s}
.pref.flash{animation:flash .7s}
@keyframes pop{0%{filter:brightness(1.4)}100%{filter:none}}
@keyframes flash{0%,60%{fill:#ff8f87}}
.lbl{font-weight:900;fill:#3b2f2a;text-anchor:middle;dominant-baseline:central;pointer-events:none;
  paint-order:stroke;stroke:#fff;stroke-width:.7;stroke-linejoin:round}
.rv{fill:none;stroke:#3aa0e8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rvhit{fill:none;stroke:transparent;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.rv.big{stroke:#0b6fd1}
.rvname,.mtname{font-weight:800;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:.6;stroke-linejoin:round;
  text-anchor:middle;dominant-baseline:central;display:none}
.rvname{fill:#0b6fd1}.mtname{fill:#8a4b16}
svg.z2 .rvname,svg.z2 .mtname{display:block}
.mt{cursor:pointer}
.mtmark{fill:#b45a24;stroke:#fff;stroke-width:.35}
.mtmark.big{fill:#e0382e}
.ans-line{stroke:#e8574f;stroke-width:1.2;stroke-dasharray:2 1.5;vector-effect:non-scaling-stroke}
.pulse{animation:pls 1s infinite}
@keyframes pls{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.tapmark{pointer-events:none}
.oki-frame{fill:#cfe9f8;stroke:#7ab5d9;stroke-width:.7;stroke-dasharray:2 1.2}
.oki-note{font-size:2.4px;fill:#5a7a8c;text-anchor:middle;pointer-events:none;font-weight:700}
</style>

<style>
/* 世界版の追加・上書き */
.layers{flex-wrap:wrap;max-width:calc(100% - 76px)}
.pref.out{opacity:.45}
.pref.out.un{fill:#e9eef2}
.pref.hl{stroke-width:2.6px}
.hit{fill:transparent;cursor:pointer}
.flagbig{font-size:60px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cflag{font-size:34px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.rvhit{vector-effect:non-scaling-stroke;stroke-width:16px}
.mf .it2 b{font-size:24px}
.ic.w{background:#d6ecff}
</style>
</head>
<body>

<!-- ホーム -->
<section id="home" class="screen on">
 <div class="home-in">
  <div class="logo"><div class="em">🌍🌏🌎</div><div class="big">せかい たんけんクイズ</div>
   <div class="sm">ヒントをよんで、地図をタッチ！ 世界の国・山・川をおぼえよう</div></div>
  <div class="menu">
   <button class="mbtn" data-mode="pref"><div class="ic p">🚩</div><div><b>国クイズ</b><span class="d">絵やヒントから、どこの国かあててタッチ！</span></div></button>
   <button class="mbtn" data-mode="mt"><div class="ic m">⛰️</div><div><b>世界の山クイズ</b><span class="d">エベレストやキリマンジャロはどこ？</span></div></button>
   <button class="mbtn" data-mode="river"><div class="ic r">🌊</div><div><b>世界の川クイズ</b><span class="d">ナイル川やアマゾン川はどこを流れてる？</span></div></button>
   <button class="mbtn" data-mode="atlas"><div class="ic a">📖</div><div><b>世界地図ずかん</b><span class="d">国・山・川をタッチして調べよう</span></div></button>
  </div>
  <div class="opts">
   <h3>🌐 どこの地図で あそぶ？（大陸をえらぶ）</h3>
   <div class="chips" id="regChips"></div>
  </div>
  <div class="opts">
   <h3>🔢 1回の問題数</h3>
   <div class="chips" id="cntChips"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="foot">ホーム画面に追加すると、アプリのように使えます（Safari の共有ボタン →「ホーム画面に追加」）。<br>
   川の線や山の位置はおおまかな目安です。小さな国は ● をタッチしてね。</div>
 </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen">
 <div class="top">
  <button class="back" id="btnBack">◀ もどる</button>
  <div class="ttl" id="gTitle"></div>
  <div class="sc" id="gScore">⭐0</div>
  <button class="snd" id="btnSnd">🔊</button>
 </div>
 <div class="gm">
  <div class="panel" id="panel"></div>
  <div class="mapwrap" id="mapwrap">
   <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
   <div class="layers" id="layers"></div>
   <div class="zb"><button id="zIn">＋</button><button id="zOut">－</button><button id="zHome">⌂</button></div>
   <div class="toast" id="toast"></div>
  </div>
 </div>
</section>

<div class="modal" id="cardModal"><div class="mc" id="mcBody"></div></div>

<!-- 結果 -->
<section id="result" class="screen">
 <div class="res-in" id="resIn"></div>
</section>

// 経緯度 → 地図座標 (ミラー図法。export_world.py と同じ式)
function proj(lon, lat){
  const r=Math.max(-85,Math.min(85,lat))*Math.PI/180;
  return [lon, -(1.25*Math.log(Math.tan(Math.PI/4+0.4*r))*180/Math.PI)];
}

let actx=null;
function tone(seq){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    seq.forEach(([f,d,type])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||"sine"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.start(t); o.stop(t+d+.02); t+=d*.8;
    });
  }catch(e){}
}
const sndOK=()=>tone([[660,.12],[880,.12],[1175,.22]]);
const sndNG=()=>tone([[220,.18,"square"],[180,.22,"square"]]);
function say(t){
  if(!settings.sound||!("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=.95; speechSynthesis.speak(u);}catch(e){}
}

const svg = $("#map");
let FULL = {x:D.views["世界"][0],y:D.views["世界"][1],w:D.views["世界"][2],h:D.views["世界"][3]};
let vb = {...FULL};
const gPref = el("g",{id:"gPref"},svg), gHit = el("g",{id:"gHit"},svg), gRiv = el("g",{id:"gRiv"},svg), gMt = el("g",{id:"gMt"},svg), gOv = el("g",{id:"gOv"},svg);
const prefEl = {}, lblEl = {}, hitEl = {}, rvEls = {}, mtEls = {};
let tapHandler = null;

function buildMap(){
  for(const c of D.order){
    prefEl[c] = el("path",{d:D.paths[c],class:"pref un","data-pid":c},gPref);
  }
  for(const c in D.labels){
    const [x,y,fs]=D.labels[c];
    const t=el("text",{x:x,y:y,class:"lbl","font-size":fs,"data-lid":c,"data-fs":fs,visibility:"hidden"},gPref);
    t.textContent = nameOf(c); lblEl[c]=t;
  }
  // 小さな国のタッチ用の丸(ふだんは見えない)
  for(const c in P){
    const h=D.hit[c];
    if(h[2]<9) hitEl[c]=el("circle",{cx:h[0],cy:h[1],r:0,class:"hit","data-pid":c},gHit);
  }
  RIVERS.forEach((r,i)=>{
    const pts=r[7].map(([lo,la])=>proj(lo,la));
    r.pts=pts;
    const d="M"+pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join("L");
    const g=el("g",{class:"riv","data-ri":i},gRiv);
    el("path",{d:d,class:"rvhit"},g);
    el("path",{d:d,class:"rv","stroke-width":"2.4"},g);
    const m=pts[Math.floor(pts.length/2)];
    const t=el("text",{x:m[0]+3,y:m[1]-2,class:"rvname","font-size":"2.6","data-x":m[0],"data-y":m[1]},g); t.textContent=r[0].replace(/（.*）/,"");
    rvEls[i]=g;
  });
  MOUNTS.forEach((m,i)=>{
    const [x,y]=proj(m[3],m[4]); m.xy=[x,y];
    const g=el("g",{class:"mt","data-mi":i,"data-x":x,"data-y":y},gMt);
    el("circle",{cx:x,cy:y,r:3.2,fill:"transparent",class:"mthit"},g);
    el("path",{d:`M${x},${y-2.1}L${x+1.9},${y+1.4}L${x-1.9},${y+1.4}Z`,class:"mtmark"+(m[2]>=5000?" big":"")},g);
    const t=el("text",{x:x,y:y+4.2,class:"mtname","font-size":"2.5"},g); t.textContent=m[0];
    mtEls[i]=g;
  });
  setVB();
}

function baseClass(c){ return "pref un"+(inCont(c)?"":" out"); }
// 大陸ごとの表示範囲に切りかえる
function applyCont(cont){
  const v=D.views[cont]; FULL={x:v[0],y:v[1],w:v[2],h:v[3]}; vb={...FULL};
  for(const c in prefEl) prefEl[c].setAttribute("class",baseClass(c));
}

function setVB(){
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const z=FULL.w/vb.w;
  svg.classList.toggle("z2",z>=1.8);
  updateScaling();
}
function updateScaling(){
  const k=ppu(); if(!k||!(k>0.05)) return;
  for(const id in lblEl){
    const t=lblEl[id], o=+t.dataset.fs, f=Math.min(o,11.5/k);
    t.setAttribute("font-size",f.toFixed(2)); t.style.strokeWidth=(f*0.22).toFixed(2);
    t.style.display=(f*k<4.6)?"none":"";
  }
  for(const c in hitEl){
    const h=D.hit[c], tiny=h[2]*k<22;
    hitEl[c].setAttribute("r",tiny?(14/k).toFixed(2):0);
    hitEl[c].style.pointerEvents=tiny?"":"none";
  }
  const fz=(10.5/k).toFixed(2);
  for(const i in mtEls){
    const g=mtEls[i], x=+g.dataset.x, y=+g.dataset.y;
    const sc=Math.max(.2,Math.min(8,9/k/3.6));
    g.querySelector(".mtmark").setAttribute("transform",`translate(${x} ${y}) scale(${sc.toFixed(3)}) translate(${-x} ${-y})`);
    const h=g.querySelector(".mthit"); h.setAttribute("r",Math.min(12,13/k).toFixed(2));
    const t=g.querySelector("text"); t.setAttribute("font-size",fz); t.setAttribute("y",(y+7.5/k).toFixed(2)); t.style.strokeWidth=(10.5/k*.2).toFixed(2);
  }
  for(const i in rvEls){
    const t=rvEls[i].querySelector(".rvname"), x=+t.dataset.x, y=+t.dataset.y;
    t.setAttribute("font-size",fz); t.setAttribute("x",(x+5/k).toFixed(2)); t.setAttribute("y",(y-4/k).toFixed(2)); t.style.strokeWidth=(10.5/k*.2).toFixed(2);
  }
}
function clampVB(){
  const mw=FULL.w*.15, mh=FULL.h*.15;
  vb.x=Math.min(Math.max(vb.x,FULL.x-mw),FULL.x+FULL.w+mw-vb.w);
  vb.y=Math.min(Math.max(vb.y,FULL.y-mh),FULL.y+FULL.h+mh-vb.h);
}
function ppu(){ const m=svg.getScreenCTM(); return m?m.a:1; }
function clientToSvg(cx,cy){
  const pt=svg.createSVGPoint(); pt.x=cx; pt.y=cy; const m=svg.getScreenCTM().inverse(); const p=pt.matrixTransform(m); return [p.x,p.y];
}
function zoomAt(f,cx,cy){
  const nw=Math.min(FULL.w,Math.max(FULL.w/14,vb.w/f)), r=nw/vb.w;
  vb.x=cx-(cx-vb.x)*r; vb.y=cy-(cy-vb.y)*r; vb.w=nw; vb.h=nw*FULL.h/FULL.w; clampVB(); setVB();
}
function resetView(){ vb={...FULL}; setVB(); }
function zoomTo(x,y,z){ vb.w=FULL.w/z; vb.h=FULL.h/z; vb.x=x-vb.w/2; vb.y=y-vb.h/2; clampVB(); setVB(); }

const ptrs=new Map(); let tapInfo=null, lastPinch=null;
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1) tapInfo={x:e.clientX,y:e.clientY,t:Date.now(),moved:false,multi:false};
  else { if(tapInfo) tapInfo.multi=true; lastPinch=null; }
});
svg.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y;
  if(ptrs.size===1){
    if(tapInfo && !tapInfo.moved && Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>8) tapInfo.moved=true;
    if(tapInfo && tapInfo.moved){
      const k=ppu(); vb.x-=dx/k; vb.y-=dy/k; clampVB(); setVB();
    }
  } else if(ptrs.size>=2){
    const a=[...ptrs.values()];
    p.x=e.clientX; p.y=e.clientY;
    const [p1,p2]=[a[0],a[1]];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y), mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    if(lastPinch){
      const k=ppu();
      vb.x-=(mx-lastPinch.mx)/k; vb.y-=(my-lastPinch.my)/k;
      const [sx,sy]=clientToSvg(mx,my);
      if(lastPinch.d>0) zoomAt(d/lastPinch.d,sx,sy); else {clampVB();setVB();}
    }
    lastPinch={d,mx,my}; return;
  }
  p.x=e.clientX; p.y=e.clientY;
});
function endPtr(e){
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId);
  if(!had) return;
  if(ptrs.size<2) lastPinch=null;
  if(ptrs.size===0 && tapInfo){
    const ti=tapInfo; tapInfo=null;
    if(e.type==="pointerup" && !ti.moved && !ti.multi && Date.now()-ti.t<800){
      const [sx,sy]=clientToSvg(e.clientX,e.clientY);
      curEls=document.elementsFromPoint(e.clientX,e.clientY);
      onTap(sx,sy,curEls[0]);
    }
  }
}
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{ e.preventDefault(); const [sx,sy]=clientToSvg(e.clientX,e.clientY); zoomAt(e.deltaY<0?1.2:1/1.2,sx,sy); },{passive:false});
$("#zIn").onclick=()=>zoomAt(1.5,vb.x+vb.w/2,vb.y+vb.h/2);
$("#zOut").onclick=()=>zoomAt(1/1.5,vb.x+vb.w/2,vb.y+vb.h/2);

function onTap(x,y,t){ if(tapHandler) tapHandler(x,y,t); }
function toast(msg,ms=1600){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),ms);
}
let curEls=[];
function pidOf(t){
  for(const n of curEls){ const e=n.closest&&n.closest("[data-pid]"); if(e) return e.dataset.pid; }
  return null;
}

/* 地図の見た目を初期化 */
let layerState={mt:false,river:false};
function resetMapView(opts){
  opts=opts||{};
  gOv.innerHTML="";
  applyCont(settings.cont);
  for(const c in prefEl){ prefEl[c].style.fill=""; prefEl[c].style.opacity=""; }
  for(const c in lblEl) lblEl[c].setAttribute("visibility","hidden");
  if(opts.colored) for(const c in prefEl) if(inCont(c)) colorPref(c,true);
  for(const i in rvEls){ rvEls[i].style.display="none"; delete rvEls[i].dataset.keep; const l=rvEls[i].querySelector(".rv"); l.classList.remove("big"); l.setAttribute("stroke-width","2.4"); rvEls[i].querySelector(".rvname").style.display=""; }
  for(const i in mtEls){ mtEls[i].style.display="none"; delete mtEls[i].dataset.keep; }
  layerState={mt:false,river:false};
  setVB();
}
function colorPref(c,label){
  prefEl[c].style.fill=RC[D.sub[c]]||"#e4e9ee";
  prefEl[c].classList.remove("un");
  if(label && lblEl[c]) lblEl[c].setAttribute("visibility","visible");
}
function setLayer(kind,on){
  layerState[kind]=on;
  if(kind==="river") for(const i in rvEls) rvEls[i].style.display=(on||rvEls[i].dataset.keep)?"":"none";
  if(kind==="mt") for(const i in mtEls) mtEls[i].style.display=(on||mtEls[i].dataset.keep)?"":"none";
  renderLayerBtns();
}
function renderLayerBtns(){
  const box=$("#layers"); box.innerHTML="";
  if(curMode==="atlas"){
    [["mt","⛰ 山"],["river","🌊 川"]].forEach(([k,l])=>{
      const b=document.createElement("button"); b.textContent=l; b.className=layerState[k]?"on":"";
      b.onclick=()=>setLayer(k,!layerState[k]); box.appendChild(b);
    });
  }
}
function highlightPrefs(ids,dimOthers){
  for(const c in prefEl){ prefEl[c].classList.remove("hl","dim"); }
  if(!ids||!ids.length) return;
  for(const c in prefEl){
    if(ids.includes(c)) prefEl[c].classList.add("hl");
    else if(dimOthers) prefEl[c].classList.add("dim");
  }
  ids.forEach(c=>gPref.appendChild(prefEl[c]));
  for(const c in lblEl) gPref.appendChild(lblEl[c]);
}
function regionBg(region){
  const ids=subIds[region]||[];
  highlightPrefs(ids,true);
  ids.forEach(c=>{ if(prefEl[c].classList.contains("un")) prefEl[c].style.fill=(RC[region]||"#ccc")+"99"; });
}
function clearHintFill(){ for(const c in prefEl){ if(prefEl[c].classList.contains('un')) prefEl[c].style.fill=''; } }
function bboxCenter(c){
  const b=D.bbox[c]; return [(b[0]+b[2])/2,(b[1]+b[3])/2,Math.max(b[2]-b[0],b[3]-b[1])];
}

/* ===================== ホーム ===================== */
let curMode=null;
function renderHome(){
  const rc=$("#regChips"); rc.innerHTML="";
  CONTS.forEach(r=>{
    const b=document.createElement("button"); b.className="chip"+(settings.cont===r?" on":""); b.textContent=r==="世界"?"🌐 せかい全体":r;

  });

document.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>startMode(b.dataset.mode));
let backArm=null;
$("#btnBack").onclick=()=>{

  b.textContent="もういちどでやめる"; toast("もういちどタップするとホームにもどるよ");
  backArm=setTimeout(()=>{ backArm=null; b.textContent="◀ もどる"; },2500);

$("#btnSnd").onclick=()=>{ settings.sound=!settings.sound; saveAll(); $("#btnSnd").textContent=settings.sound?"🔊":"🔇"; if(!settings.sound&&"speechSynthesis" in window) speechSynthesis.cancel(); else sndOK(); };
function goHome(){ $("#btnBack").textContent="◀ もどる"; tapHandler=null; curMode=null; closeCard(); renderHome(); show("home"); }

/* ===================== クイズ共通 ===================== */
let Q=null;
const MAXPTS=3;
const contTitle=()=>settings.cont==="世界"?"せかい":settings.cont;
function startMode(mode,onlyList){
  curMode=mode;
  show("game");
  $("#gTitle").textContent={pref:"🚩 国クイズ",mt:"⛰️ 世界の山クイズ",river:"🌊 世界の川クイズ",atlas:"📖 世界地図ずかん"}[mode]+(mode==="atlas"?"":"（"+contTitle()+"）");
  requestAnimationFrame(()=>{
    if(mode==="atlas") return startAtlas();
    let pool;
    if(mode==="pref") pool=Object.keys(P).filter(c=>inCont(c));
    else if(mode==="mt") pool=MOUNTS.map((_,i)=>i).filter(i=>settings.cont==="世界"||MOUNTS[i][8]===settings.cont);
    else pool=RIVERS.map((_,i)=>i).filter(i=>settings.cont==="世界"||RIVERS[i][8]===settings.cont);
    let list = onlyList || shuffle(pool);
    if(!onlyList && settings.count!=="ぜんぶ") list=list.slice(0,Math.min(settings.count,list.length));
    Q={mode,list,i:0,score:0,results:[],tries:0,hints:0,done:false};
    resetMapView({colored:false});
    renderLayerBtns();
    $("#gScore").textContent="⭐0";
    nextQuestion(true);
  });
}
function nextQuestion(first){
  if(!first) Q.i++;
  if(Q.i>=Q.list.length) return finish();
  Q.tries=0; Q.hints=0; Q.done=false; Q.hintShown=[];
  gOv.innerHTML="";
  highlightPrefs([],false); clearHintFill();
  if(Q.mode==="pref") askCountry(); else if(Q.mode==="mt") askMt(); else askRiver();
}
function addScore(n){ Q.score+=n; $("#gScore").textContent="⭐"+Q.score; }
function record(id,st){ Q.results.push({id,stars:st}); }

function finish(){
  tapHandler=null;
  const max=Q.list.length*MAXPTS, pct=Math.round(Q.score/max*100);
  const k=Q.mode; stats[k]=stats[k]||{plays:0,best:null};
  stats[k].plays=(stats[k].plays||0)+1;
  const pts=Math.round(Q.score/max*100);
  if(stats[k].best==null||pts>stats[k].best) stats[k].best=pts;
  saveAll();
  const msg=pct>=90?"かんぺき！ せかいたんけん名人だね！":pct>=70?"すごい！ よくおぼえているね":pct>=40?"いいちょうし！ もう少し！":"つぎはもっとできるよ！ ヒントをつかってみよう";
  const name=r=> Q.mode==="pref"?P[r.id].name:Q.mode==="mt"?MOUNTS[r.id][0]:RIVERS[r.id][0];
  const miss=Q.results.filter(r=>r.stars<2);
  $("#resIn").innerHTML=`
   <div style="font-size:54px">${pct>=70?"🎉":"🌟"}</div><h2>${pts}点！</h2>
   <div class="bigstars">${stars(Math.round(Q.score/Q.list.length))}</div>
   <p style="font-weight:800">${msg}</p>
   <div class="lst">${Q.results.map(r=>`<div><span>${r.stars>=2?"✅":r.stars===1?"🔶":"❌"} ${name(r)}</span><span>${stars(r.stars)}</span></div>`).join("")}</div>
   <div class="btns" style="justify-content:center">
     <button class="btn pri" id="rAgain">もういちど</button>
     ${miss.length?`<button class="btn hint-b" id="rMiss">にがてだけ（${miss.length}）</button>`:""}
     <button class="btn" id="rMap">完成した地図を見る</button>
     <button class="btn" id="rHome">ホーム</button>
   </div>`;
  show("result");
  $("#rAgain").onclick=()=>startMode(Q.mode);
  if($("#rMiss")) $("#rMiss").onclick=()=>startMode(Q.mode,shuffle(miss.map(r=>r.id)));
  $("#rHome").onclick=goHome;
  $("#rMap").onclick=()=>{ const keep=Q; show("game"); showCompleted(keep); };
  if(pct>=70) sndOK();
}
function showCompleted(keep){
  tapHandler=null;
  const pn=$("#panel");
  curMode="atlas"; resetMapView({colored:true});
  setLayer("mt",true); setLayer("river",true);
  for(const c in lblEl) lblEl[c].setAttribute("visibility","visible");
  startAtlasTap();
  pn.innerHTML=`<div class="q-main">🌍 完成した世界地図！</div><div class="facts">拡大して、国・山・川をタッチして調べよう。</div>
   <div class="btns"><button class="btn pri" id="cHome">ホームにもどる</button></div>`;
  $("#cHome").onclick=goHome;
  $("#gTitle").textContent="📖 世界地図ずかん";
}

/* ---------- ヒント表示 ---------- */
function maskText(t,names){
  names.slice().sort((a,b)=>b.length-a.length).forEach(n=>{ if(n) t=t.split(n).join("○".repeat(n.length)); });
  return t;
}
function hintPanel(hintFns){
  const box=$("#hintBox");
  box.innerHTML=Q.hintShown.map(i=>`<div class="hint">${hintFns[i].html()}</div>`).join("");
  const b=$("#btnHint");
  if(b){ b.textContent=`💡ヒント（${Q.hints}/${hintFns.length}）`; b.disabled=Q.hints>=hintFns.length||Q.done; }
}
function bindHint(hintFns){
  $("#btnHint").onclick=()=>{
    if(Q.hints>=hintFns.length||Q.done) return;
    const f=hintFns[Q.hints]; Q.hintShown.push(Q.hints); Q.hints++;
    if(f.apply) f.apply();
    hintPanel(hintFns);
  };
  hintPanel(hintFns);
}
function calcStars(base){
  const pen=Q.mode==="pref"?(Q.hints>=6?2:Q.hints>=3?1:0):Math.min(2,Q.hints>=3?2:Q.hints>=1?1:0);
  let s=base-pen-(Q.tries>0?1:0);
  return Math.max(1,s);
}
function finishQ(st,id,html,good){
  Q.done=true; record(id,st); addScore(st);
  const p=$("#panel");
  const last=Q.i>=Q.list.length-1;
  p.innerHTML=`<div class="q-lab"><span>${Q.i+1} / ${Q.list.length}</span><span>${stars(st)}</span></div>
    <div class="res ${good?"good":"bad"}">${html}</div>
    <div class="btns"><button class="btn ok" id="btnNext">${last?"けっかを見る ▶":"つぎへ ▶"}</button></div>`;
  $("#btnNext").onclick=()=>nextQuestion();
  p.scrollTop=0;
}

/* ===================== 国クイズ ===================== */
function nbHint(d){
  const k=d.kind==="island"?"まわりを海にかこまれた島国だよ。陸でつながっている国はないよ。":d.kind==="landlocked"?"海に面していない内陸国（ないりくこく）だよ。":"海に面している国だよ。";
  return (d.nb.length?d.nb.join("・")+"。":"")+k;
}
function askCountry(){
  const id=Q.list[Q.i], d=P[id];
  const names=[d.name,d.cap];
  const mk=s=>maskText(s,names);
  const nbTxt=nbHint(d);
  const hints=[
    {html:()=>`<b>せつめい：</b>${mk(d.blurb)}`},
    {html:()=>`<b>🏛 文明・歴史：</b>${mk(d.hist)}`},
    {html:()=>`<b>🚩 国旗：</b><span class="cflag">${d.flag||"🏳️"}</span><br>${mk(d.flagtxt)}`},
    {html:()=>`<b>🗣 ことば・お金：</b>${mk(d.lang)}`},
    {html:()=>`<b>🧭 となりの国：</b>${mk(nbTxt)}`},
    {html:()=>`<b>🌍 地域：</b>${d.cont}の${d.region}（地図の色つきの場所だよ）`, apply:()=>regionBg(d.region)},
    {html:()=>`<b>⭐ 首都：</b>${mk(d.cap)}`},
  ];
  $("#panel").innerHTML=`<div class="q-lab"><span>${Q.i+1} / ${Q.list.length}</span><span>ここはどこの国？</span></div>
   <div class="q-main">この絵と言葉がヒント！ <small>どこの国かな？ 地図をタッチ👆</small></div>
   <div class="emo">${d.items.map(([e,l])=>`<div class="eb"><b>${e}</b><i>${maskText(l,names)}</i></div>`).join("")}</div>
   <div id="hintBox"></div>
   <div class="btns"><button class="btn hint-b" id="btnHint">💡ヒント</button><button class="btn" id="btnSkip">わからない</button></div>`;
  bindHint(hints);
  $("#btnSkip").onclick=()=>{ if(!Q.done) revealCountry(id,false); };
  tapHandler=(x,y,t)=>{
    if(Q.done) return;
    const pid=pidOf(t);
    if(!pid){ toast("そこは海だよ 🌊"); return; }
    if(pid===id){ revealCountry(id,true); return; }
    Q.tries++; sndNG();
    const p=prefEl[pid]; p.classList.remove("flash"); void p.getBoundingClientRect(); p.classList.add("flash");
    toast(`そこは「${nameOf(pid)}」だよ。もういちど！`);
    if(Q.tries>=3) revealCountry(id,false);
  };
}
function revealCountry(id,good){
  const d=P[id];
  highlightPrefs([],false); clearHintFill(); colorPref(id,true);
  prefEl[id].classList.add("pop");
  gPref.appendChild(prefEl[id]); for(const k in lblEl) gPref.appendChild(lblEl[k]);
  const [cx,cy,sz]=bboxCenter(id);
  if(!good) el("circle",{cx,cy,r:Math.max(2.5,sz*0.7),fill:"none",stroke:"#e8574f","stroke-width":"1.6",class:"pulse","vector-effect":"non-scaling-stroke"},gOv);
  const st=good?calcStars(3):0;
  if(good){ sndOK(); say(d.name+"、せいかい"); } else { sndNG(); say("こたえは、"+d.name); }
  const z=FULL.w/(sz*3.2);
  if(z>1.15) zoomTo(cx,cy,Math.min(8,z)); else resetView();
  const html=`<h4>${good?"🎉 せいかい！":"😢 ざんねん…こたえは"} 「${d.name}」</h4>
    <div class="facts">
     <div class="row"><span class="cflag">${d.flag}</span> <span class="tag" style="background:${RC[d.region]}">${d.region}</span>首都：${d.cap}</div>
     <div class="row" style="font-size:30px">${d.items.map(([e,l])=>`<span title="${l}">${e}</span>`).join(" ")}</div>
     <div class="row">${d.items.map(([e,l])=>l).join("・")}</div>
     <div class="row">${d.blurb}</div>
     <div class="row"><b>🏛</b> ${d.hist}</div>
     <div class="row"><b>🚩</b> ${d.flagtxt}</div>
     <div class="row"><b>🗣</b> ${d.lang}</div>
     <div class="row"><b>🧭</b> ${nbHint(d)}</div></div>`;
  finishQ(st,id,html,good);
  setTimeout(()=>showCountryCard(id,{good,next:()=>nextQuestion()}),good?650:900);
}

/* ===================== 山クイズ ===================== */
function regionsOf(codes){ return [...new Set(codes.map(c=>P[c].region))]; }
function askMt(){
  const i=Q.list[Q.i], m=MOUNTS[i];
  const regs=regionsOf(m[5]);
  const hints=[
    {html:()=>`<b>標高：</b>${fmt(m[2])}m`},
    {html:()=>`<b>せつめい：</b>${m[7].replace(m[0],"この山")}`},
    {html:()=>`<b>大陸：</b>${m[8]}　<b>地域：</b>${regs.join("・")}（色つきの場所のどこか）`, apply:()=>highlightPrefs(regs.flatMap(r=>subIds[r]||[]),true)},
    {html:()=>`<b>ある国：</b>${m[5].map(nameOf).join("・")}`, apply:()=>highlightPrefs(m[5],true)},
  ];
  $("#panel").innerHTML=`<div class="q-lab"><span>${Q.i+1} / ${Q.list.length}</span><span>山の場所をさがそう</span></div>
   <div class="q-main">${m[6]} <ruby>${m[0]}<rt>${m[1]}</rt></ruby> <small>はどこ？ 地図をタッチ👆</small></div>
   <div id="hintBox"></div>
   <div class="btns"><button class="btn hint-b" id="btnHint">💡ヒント</button><button class="btn" id="btnSkip">わからない</button></div>`;
  bindHint(hints);
  $("#btnSkip").onclick=()=>{ if(!Q.done) revealMt(i,null); };
  tapHandler=(x,y)=>{
    if(Q.done) return;
    const k=ppu(); const tol=Math.min(9,Math.max(1.6,26/k));
    revealMt(i,{x,y,dd:Math.hypot(x-m.xy[0],y-m.xy[1]),tol});
  };
}
function revealMt(i,tap){
  const m=MOUNTS[i];
  highlightPrefs([],false);
  mtEls[i].style.display=""; mtEls[i].dataset.keep=1;
  const [x,y]=m.xy;
  el("circle",{cx:x,cy:y,r:Math.min(8,22/ppu()),fill:"none",stroke:"#e0382e","stroke-width":"1.6",class:"pulse","vector-effect":"non-scaling-stroke"},gOv);
  const t=el("text",{x:x,y:y+9/ppu(),class:"mtname","font-size":(11/ppu()).toFixed(2),style:"display:block"},gOv); t.textContent=m[0];
  let st=0,good=false,head;
  if(tap){
    el("circle",{cx:tap.x,cy:tap.y,r:4/ppu(),fill:"#e8574f",stroke:"#fff","stroke-width":".8",class:"tapmark","vector-effect":"non-scaling-stroke"},gOv);
    const r=tap.dd/tap.tol;
    if(r<=1){ good=true; st=calcStars(r<=.4?3:r<=.75?2:1); }
    if(!good) el("line",{x1:tap.x,y1:tap.y,x2:x,y2:y,class:"ans-line"},gOv);
    const km=Math.round(tap.dd*111/50)*50;
    head= good?`🎉 せいかい！ 「${m[0]}」`:`😢 おしい！ 「${m[0]}」はここだよ（約${fmt(km)}kmはなれていたよ）`;
  } else head=`😢 こたえは 「${m[0]}」`;
  if(good){ sndOK(); say(m[0]+"、せいかい"); } else { sndNG(); say("こたえは、"+m[0]); }
  const html=`<h4>${head}</h4><div class="facts">
    <div class="row"><span class="tag" style="background:#d9efd2">標高 ${fmt(m[2])}m</span>${m[5].map(nameOf).join("・")}</div>
    <div class="row">${m[7]}</div></div>`;
  finishQ(st,i,html,good);
}

/* ===================== 川クイズ ===================== */
function distSeg(px,py,a,b){
  const vx=b[0]-a[0], vy=b[1]-a[1], wx=px-a[0], wy=py-a[1];
  const t=Math.max(0,Math.min(1,(vx*wx+vy*wy)/(vx*vx+vy*vy||1)));
  return Math.hypot(px-(a[0]+t*vx),py-(a[1]+t*vy));
}
function distRiver(r,x,y){ let m=1e9; for(let k=0;k<r.pts.length-1;k++) m=Math.min(m,distSeg(x,y,r.pts[k],r.pts[k+1])); return m; }
function askRiver(){
  const i=Q.list[Q.i], r=RIVERS[i];
  const regs=regionsOf(r[3]);
  const hints=[
    {html:()=>`<b>長さ：</b>${fmt(r[2])}km`},
    {html:()=>`<b>せつめい：</b>${r[5].replace(r[0],"この川")}`},
    {html:()=>`<b>大陸：</b>${r[8]}　<b>地域：</b>${regs.join("・")}（色つきの場所のどこか）`, apply:()=>highlightPrefs(regs.flatMap(x=>subIds[x]||[]),true)},
    {html:()=>`<b>流れる国：</b>${r[3].map(nameOf).join("・")}　<b>そそぐ海：</b>${r[6]}`, apply:()=>highlightPrefs(r[3],true)},
  ];
  $("#panel").innerHTML=`<div class="q-lab"><span>${Q.i+1} / ${Q.list.length}</span><span>川をさがそう</span></div>
   <div class="q-main">${r[4]} <ruby>${r[0].replace(/（.*）/,"")}<rt>${r[1]}</rt></ruby> <small>はどこを流れてる？ 川の上をタッチ👆</small></div>
   <div id="hintBox"></div>
   <div class="btns"><button class="btn hint-b" id="btnHint">💡ヒント</button><button class="btn" id="btnSkip">わからない</button></div>`;
  bindHint(hints);
  $("#btnSkip").onclick=()=>{ if(!Q.done) revealRiver(i,null); };
  tapHandler=(x,y)=>{
    if(Q.done) return;
    const k=ppu(); const tol=Math.min(6,Math.max(1.2,22/k));
    revealRiver(i,{x,y,dd:distRiver(r,x,y),tol});
  };
}
function revealRiver(i,tap){
  const r=RIVERS[i];
  highlightPrefs([],false);
  rvEls[i].style.display=""; rvEls[i].dataset.keep=1;
  const line=rvEls[i].querySelector(".rv"); line.classList.add("big"); line.setAttribute("stroke-width","3.6");
  rvEls[i].querySelector(".rvname").style.display="block";
  let st=0,good=false,head;
  if(tap){
    el("circle",{cx:tap.x,cy:tap.y,r:4/ppu(),fill:"#e8574f",stroke:"#fff","stroke-width":".8",class:"tapmark","vector-effect":"non-scaling-stroke"},gOv);
    const rr=tap.dd/tap.tol;
    if(rr<=1){ good=true; st=calcStars(rr<=.4?3:rr<=.75?2:1); }
    head=good?`🎉 せいかい！ 「${r[0]}」`:`😢 おしい！ 「${r[0]}」はこの青い線だよ`;
  } else head=`😢 こたえは 「${r[0]}」`;
  if(good){ sndOK(); say(r[0].replace(/（.*）/,"")+"、せいかい"); } else { sndNG(); say("こたえは、"+r[0].replace(/（.*）/,"")); }
  const xs=r.pts.map(p=>p[0]), ys=r.pts.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2, sz=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  const z=FULL.w/(sz*2.2); if(z>1.15) zoomTo(cx,cy,Math.min(6,z)); else resetView();
  const html=`<h4>${head}</h4><div class="facts">
    <div class="row"><span class="tag" style="background:#cfe9fb">長さ ${fmt(r[2])}km</span>${r[3].map(nameOf).join("・")} → ${r[6]}</div>
    <div class="row">${r[5]}</div></div>`;
  finishQ(st,i,html,good);
}

/* ===================== ずかん ===================== */
function startAtlas(){
  Q=null; curMode="atlas";
  resetMapView({colored:true});
  for(const c in lblEl) lblEl[c].setAttribute("visibility","visible");
  setLayer("mt",true); setLayer("river",true);
  $("#gScore").textContent="";
  $("#panel").innerHTML=`<div class="q-main">📖 世界地図ずかん（${contTitle()}）</div>
   <div class="chips" id="atlasConts" style="margin:6px 0"></div>
   <div class="facts">国・山(▲)・川(青い線)をタッチすると、くわしく見られるよ。地図は2本指でひろげたり、ドラッグで動かせるよ。</div>
   <div class="btns"><button class="btn" id="btnAll">地域の色</button></div>
   <div id="atlasInfo"></div>`;
  CONTS.forEach(c=>{
    const b=document.createElement("button"); b.className="chip"+(settings.cont===c?" on":""); b.textContent=c==="世界"?"🌐 せかい":c;
    b.onclick=()=>{ settings.cont=c; saveAll(); startAtlas(); }; $("#atlasConts").appendChild(b);
  });
  $("#btnAll").onclick=()=>{
    const subs=[...new Set(Object.keys(D.sub).filter(c=>inCont(c)).map(c=>D.sub[c]).filter(Boolean))];
    $("#atlasInfo").innerHTML=subs.map(r=>`<span class="tag" style="background:${RC[r]};margin:3px">${r}</span>`).join("");
  };
  startAtlasTap();
}
function startAtlasTap(){
  tapHandler=(x,y,t)=>{
    const box=$("#atlasInfo")||(()=>{ const d=document.createElement("div"); d.id="atlasInfo"; $("#panel").appendChild(d); return d; })();
    gOv.innerHTML="";
    const mt=t&&t.closest&&t.closest("[data-mi]"), rv=t&&t.closest&&t.closest("[data-ri]");
    if(mt){
      const m=MOUNTS[+mt.dataset.mi];
      el("circle",{cx:m.xy[0],cy:m.xy[1],r:Math.min(8,22/ppu()),fill:"none",stroke:"#e0382e","stroke-width":"1.6",class:"pulse","vector-effect":"non-scaling-stroke"},gOv);
      box.innerHTML=`<div class="res good"><h4>${m[6]} ${m[0]}（${m[1]}）</h4><div class="facts"><div class="row"><span class="tag" style="background:#d9efd2">標高 ${fmt(m[2])}m</span>${m[5].map(nameOf).join("・")}</div><div class="row">${m[7]}</div></div></div>`;
      say(m[0]); return;
    }
    if(rv){
      const r=RIVERS[+rv.dataset.ri];
      const l=rv.querySelector(".rv"); l.classList.add("big");
      setTimeout(()=>l.classList.remove("big"),2500);
      box.innerHTML=`<div class="res good"><h4>${r[4]} ${r[0]}（${r[1]}）</h4><div class="facts"><div class="row"><span class="tag" style="background:#cfe9fb">長さ ${fmt(r[2])}km</span>${r[3].map(nameOf).join("・")} → ${r[6]}</div><div class="row">${r[5]}</div></div></div>`;
      say(r[0].replace(/（.*）/,"")); return;
    }
    const pid=pidOf(t);
    if(pid){
      highlightPrefs([pid],false);
      const d=P[pid];
      if(d){
        showCountryCard(pid,{});
        box.innerHTML=`<div class="res good"><h4><span class="cflag">${d.flag}</span> ${d.name}</h4><div class="facts">
         <div class="row"><span class="tag" style="background:${RC[d.region]}">${d.region}</span>首都：${d.cap}</div>
         <div class="row" style="font-size:30px">${d.items.map(([e])=>e).join(" ")}</div>
         <div class="row">${d.items.map(([e,l])=>l).join("・")}</div><div class="row">${d.blurb}</div>
         <div class="row"><b>🏛</b> ${d.hist}</div><div class="row"><b>🚩</b> ${d.flagtxt}</div><div class="row"><b>🗣</b> ${d.lang}</div><div class="row"><b>🧭</b> ${nbHint(d)}</div></div></div>`;
      } else {
        box.innerHTML=`<div class="res good"><h4>${nameOf(pid)}</h4><div class="facts"><div class="row"><span class="tag" style="background:${RC[D.sub[pid]]||"#e4e9ee"}">${D.sub[pid]||D.cont[pid]||""}</span>${D.cont[pid]||""}にある国・地域だよ。</div></div></div>`;
      }
      say(nameOf(pid));
    }
  };
}

/* ===================== 国カード(大きな地図に首都・名物を表示) ===================== */
function esc(t){ return String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function closeCard(){ $("#cardModal").classList.remove("on"); }
function showCountryCard(id,opts){
  opts=opts||{};
  const d=P[id], col=RC[d.region]||"#ddd";
  const b=D.bbox[id], bw=Math.max(b[2]-b[0],1), bh=Math.max(b[3]-b[1],1);
  const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2;
  const ew=Math.max(bw*1.5,7), eh=Math.max(bh*1.5,7);          // 見せる範囲
  const W=640, H=Math.round(Math.min(520,Math.max(300,W*eh/ew)));
  const sc=Math.min(W/ew,H/eh);
  const ex0=cx-W/sc/2, ey0=cy-H/sc/2, ex1=cx+W/sc/2, ey1=cy+H/sc/2;
  let o=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  o+=`<rect width="${W}" height="${H}" fill="#d4ecfa"/><defs><clipPath id="cc"><rect width="${W}" height="${H}"/></clipPath></defs><g clip-path="url(#cc)">`;
  o+=`<g transform="scale(${sc}) translate(${-ex0} ${-ey0})" stroke-linejoin="round">`;
  for(const k of D.order){ if(k===id) continue; const bb=D.fbox[k];
    if(bb[2]<ex0||bb[0]>ex1||bb[3]<ey0||bb[1]>ey1) continue;
    o+=`<path d="${D.paths[k]}" fill="#eef2f5" stroke="#b8c6d0" stroke-width="1" vector-effect="non-scaling-stroke"/>`; }
  o+=`<path d="${D.paths[id]}" fill="${col}" stroke="#4a3d36" stroke-width="2.4" vector-effect="non-scaling-stroke"/>`;
  o+=`</g></g>`;
  const T=([x,y])=>[(x-ex0)*sc,(y-ey0)*sc];
  const lab=(x,y,t,fs,fill,w)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" font-weight="900" text-anchor="middle" fill="${fill}" stroke="#fff" stroke-width="${w}" paint-order="stroke" stroke-linejoin="round">${esc(t)}</text>`;
  // 隣の国の名前
  for(const k of D.order){ if(k===id) continue; const bb=D.fbox[k], lb=D.labels[k];
    if(!lb||bb[2]<ex0||bb[0]>ex1||bb[3]<ey0||bb[1]>ey1) continue;
    const [px,py]=T([lb[0],lb[1]]); if(px<30||px>W-30||py<14||py>H-8) continue;
    if((bb[2]-bb[0])*sc<46) continue;
    o+=lab(px,py,nameOf(k),15,"#7a8791",4); }
  const [px,py]=T(d.capxy);
  let [lx,ly]=T(D.labels[id]);
  if(Math.hypot(lx-px,ly-py)<70) ly=Math.min(H-24,py+48);   // 首都のしるしと重ならないようにずらす
  o+=lab(lx,ly,d.name,Math.min(34,Math.max(20,(bw*sc)/d.name.length*0.8)),"#3b2f2a",5);
  o+=`<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" font-size="30" text-anchor="middle" dominant-baseline="central">⭐</text>`+(d.cap===d.name?"":lab(px,py-26,d.cap,18,"#b3261e",5));
  o+=`</svg>`;
  const its=d.items.map(([e,l])=>`<span class="it2"><b>${e}</b>${esc(l)}</span>`).join("");
  $("#mcBody").innerHTML=`<div class="mh"><span class="cflag">${d.flag}</span><h2>${d.name}</h2><span class="tag" style="background:${col}">${d.region}</span>
     ${opts.good===true?'<span class="sub">🎉 せいかい！</span>':opts.good===false?'<span class="sub" style="color:var(--ng)">こたえはここ！</span>':''}</div>
    <div class="mmap">${o}</div>
    <div class="mf">
      <div class="row"><span class="k">⭐ 首都</span><span class="v">${esc(d.cap)}</span></div>
      <div class="row"><span class="k">🌍 大陸</span><span class="v">${esc(d.cont)}・${esc(d.region)}</span></div>
      <div class="row"><span class="k">🎁 名物・名所</span><span class="v">${its}</span></div>
      <div class="row"><span class="k">🏛 文明・歴史</span><span class="v">${esc(d.hist)}</span></div>
      <div class="row"><span class="k">🚩 国旗</span><span class="v"><span class="cflag">${d.flag}</span> ${esc(d.flagtxt)}</span></div>
      <div class="row"><span class="k">🗣 ことば・お金</span><span class="v">${esc(d.lang)}</span></div>
      <div class="row"><span class="k">🧭 となりの国</span><span class="v">${esc(nbHint(d))}</span></div>
      <div class="row"><span class="v" style="font-size:14px;color:var(--sub)">${esc(d.blurb)}　<small>※ ⭐＝首都。国の形や場所はおおまかな目安です。</small></span></div>
    </div>
    <div class="mbtns">${opts.next?'<button class="btn ok" id="mcNext">つぎへ ▶</button>':''}<button class="btn" id="mcClose">${opts.next?"地図にもどる":"とじる"}</button></div>`;
  $("#cardModal").classList.add("on"); $("#cardModal").scrollTop=0;
  $("#mcClose").onclick=closeCard;
  if(opts.next) $("#mcNext").onclick=()=>{ closeCard(); opts.next(); };
}
$("#cardModal").addEventListener("pointerdown",e=>{ if(e.target.id==="cardModal") closeCard(); });

document.addEventListener("gesturestart",e=>e.preventDefault());
